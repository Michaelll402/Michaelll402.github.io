name: Deploy v5 portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'v5/**'
      - '.github/workflows/deploy-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm 11.8.0
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.8.0
      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: v5/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        working-directory: v5
      - name: Check Astro and TypeScript
        run: pnpm check
        working-directory: v5
      - name: Run unit tests
        run: pnpm test
        working-directory: v5
      - name: Build and upload the Astro site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6
        with:
          path: v5
          node-version: '24'
          package-manager: pnpm@11.8.0
      - name: Validate the generated Pages artifact
        run: node scripts/validate-release.mjs
        working-directory: v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the uploaded Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
